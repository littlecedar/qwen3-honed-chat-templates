[project]
name = "qwen3-honed-chat-templates"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gguf>=0.19.0",
    "hf>=1.31.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.0",
    "ty>=0.0.80",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
invalid-assignment = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
